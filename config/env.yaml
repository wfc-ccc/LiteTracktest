# 当前启用的环境名，对应下面的同名节点。
# 也可用环境变量 LITETRACK_ENV 覆盖，例如 LITETRACK_ENV=test
active: dev

dev:
  # Spring Boot 默认端口，见后端 application.yml 的 server.port
  api_base_url: http://localhost:8080
  # Vite 开发服务器，见前端 vite.config.js
  web_base_url: http://localhost:5173
  # 造数用的项目。留空时 setup_task 会取 PM 可见的第一个项目
  project_id:
  # 复用现成任务时填这里，留空则每次由 setup_task 现造。两者等价，二选一
  task_id:
  accounts:
    admin:
      username: admin
      password: "123456"
    pm01:
      username: pm01
      password: "123456"
    dev01:
      username: dev01
      password: "123456"
    qa01:
      username: qa01
      password: "123456"
  # 数据库直连，供 utils/db.py 做接口与落库的双重断言
  db:
    host: localhost
    port: 3306
    user: root
    password: "123456"
    database: litetrack
    charset: utf8mb4

test:
  api_base_url: http://localhost:8080
  web_base_url: http://localhost:5173
  project_id:
  task_id:
  accounts:
    admin:
      username: admin
